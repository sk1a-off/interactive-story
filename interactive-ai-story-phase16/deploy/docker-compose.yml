services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-story}
      POSTGRES_USER: ${POSTGRES_USER:-story}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-story}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-story} -d ${POSTGRES_DB:-story}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    image: golang:1.25.3-alpine
    working_dir: /src
    volumes:
      - ../backend:/src
    environment:
      DATABASE_URL: postgres://story:story@postgres:5432/story?sslmode=disable
    command: ["sh","-c","go run github.com/pressly/goose/v3/cmd/goose@v3.24.2 -dir db/migrations postgres \"$$DATABASE_URL\" up"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://story:story@postgres:5432/story?sslmode=disable}
      MEDIA_ROOT: /data/generated
      MEDIA_BASE_URL: /media
      STORY_LLM_BASE_URL: ${STORY_LLM_BASE_URL:-http://host.docker.internal:8081}
      STORY_LLM_MODEL: ${STORY_LLM_MODEL:-Vikhr-Nemo-12B-Instruct-R-21-09-24-Q5_K_M}
      STORY_LLM_PROFILE: ${STORY_LLM_PROFILE:-llamacpp-16k-kvq8}
      STORY_LLM_API_KEY: ${STORY_LLM_API_KEY:-}
      SECRET_STORE_PATH: /data/secrets/provider-keys.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - generated-images:/data/generated
      - provider-secrets:/data/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8787}:8080"

  frontend:
    build:
      context: ../frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_DEV_BACKEND_TARGET: http://backend:8080
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  generated-images:
  provider-secrets:
  frontend-node-modules:
